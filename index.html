// GitHub API storage — saves data.json to the repo, works on any network
var GH_TOKEN=localStorage.getItem('jj_gh_token')||'';
var GH_REPO='rtesfaye11/jj-procurement-tracker';
var GH_FILE='data.json';
var GH_RAW='https://raw.githubusercontent.com/'+GH_REPO+'/main/'+GH_FILE;
var GH_API='https://api.github.com/repos/'+GH_REPO+'/contents/'+GH_FILE;
var _ghSha=null;
var _saveTimer=null;
var _pendingSave=null;

async function dbGetAll(){
  try{
    var r=await fetch(GH_RAW+'?t='+Date.now());
    if(!r.ok)return null;
    return await r.json();
  }catch(e){console.error('dbGetAll error',e);return null;}
}

async function dbSetAll(data){
  try{
    if(!GH_TOKEN||GH_TOKEN==='')return false;
    if(!_ghSha){
      var sr=await fetch(GH_API,{headers:{'Authorization':'token '+GH_TOKEN,'Accept':'application/vnd.github.v3+json'}});
      if(sr.ok){var sj=await sr.json();_ghSha=sj.sha;}
    }
    var content=btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    var body={message:'update tracker data',content:content};
    if(_ghSha)body.sha=_ghSha;
    var r=await fetch(GH_API,{method:'PUT',headers:{'Authorization':'token '+GH_TOKEN,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.ok){var j=await r.json();_ghSha=j.content.sha;}
    return r.ok;
  }catch(e){console.error('dbSetAll error',e);return false;}
}

// Debounced save — batches rapid changes into one GitHub write
function scheduleSave(data){
  _pendingSave=data;
  if(_saveTimer)clearTimeout(_saveTimer);
  _saveTimer=setTimeout(async function(){
    if(_pendingSave){
      var ok=await dbSetAll(_pendingSave);
      _pendingSave=null;
      if(ok){
        var el=document.getElementById('savemsg');
        if(el){el.textContent='Saved ✓';setTimeout(function(){if(el)el.textContent='';},1600);}
      }
    }
  },1500);
}
